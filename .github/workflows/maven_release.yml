# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven to release latest SNAPSHOT version

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.ENNAHDI_TOKEN }}
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        # For central server authentication
        server-id: central
        server-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        server-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        # GPG setup
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE
        cache: maven
    - name: Configure Git user
      run: |
        git config user.email "mohamed.ennahdi@gmail.com"
        git config user.name "Mohamed Ennahdi El Idrissi"

    - name: Create settings.xml with GPG passphrase server
      run: |
        cat > ~/.m2/settings.xml << 'EOF'
        <settings>
          <servers>
            <server>
              <id>central</id>
              <username>${env.MAVEN_CENTRAL_USERNAME}</username>
              <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
            </server>
            <server>
              <id>gpg.passphrase</id>
              <passphrase>${env.GPG_PASSPHRASE}</passphrase>
            </server>
          </servers>
        </settings>
        EOF

    - name: Build with Maven
      run: mvn -B release:clean release:prepare release:perform --file pom.xml
      env:
        GITHUB_TOKEN: ${{ secrets.ENNAHDI_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
